name: Release

# 打 tag（例如 v1.0.0）就会自动打包并创建 Release。
# 也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.0.0（手动触发时必填）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 自检
        run: npm run check

      - name: 读取版本号
        id: ver
        run: |
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 版本与 tag 是否一致
        run: |
          TAG="${TAG}"
          VERSION="${VERSION}"
          echo "tag=$TAG version=$VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag（$TAG）与 manifest.json 版本（$VERSION）不一致，请先改版本号再打 tag"
            exit 1
          fi
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}

      - name: 打包（manifest.json 在压缩包根目录，解压即可加载）
        run: |
          OUT="bilibili-comment-collector-${{ steps.ver.outputs.version }}.zip"
          zip -r "$OUT" manifest.json src LICENSE README.md -x "*.DS_Store"
          unzip -l "$OUT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "bilibili-comment-collector-$VERSION.zip" --clobber
          else
            gh release create "$TAG" \
              "bilibili-comment-collector-$VERSION.zip" \
              --title "v$VERSION" \
              --generate-notes \
              --notes "安装：下载下面的 zip，解压到任意目录，然后打开 chrome://extensions → 开发者模式 → 加载已解压的扩展程序 → 选解压后的文件夹。"
          fi
