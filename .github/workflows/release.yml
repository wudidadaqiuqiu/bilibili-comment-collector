name: Release

# 打 tag（例如 v1.1.0）就会自动打包并创建 Release。
# 也可以在 Actions 页面手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v1.1.0（手动触发时必填）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 自检
        run: npm run check

      - name: 读取版本号
        id: ver
        run: |
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: 版本与 tag 是否一致
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag（$TAG）与 manifest.json 版本（$VERSION）不一致，请先改版本号再打 tag"
            exit 1
          fi
          echo "tag=$TAG version=$VERSION"
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}

      - name: 打包（Chrome/Edge 通用包 + Firefox/AMO 包）
        run: npm run build

      - name: 列出产物
        run: ls -la dist/

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES="## 安装
          **Chrome / Edge**：下载 \`bilibili-comment-collector-$VERSION.zip\`，解压到固定目录，
          打开 chrome://extensions → 开启开发者模式 → 加载已解压的扩展程序 → 选解压后的文件夹。

          **Firefox**：下载 \`bilibili-comment-collector-$VERSION-firefox.xpi\`。
          正式版 Firefox 只接受已签名扩展，这个包是 AMO 上架用的；未签名时可用
          about:debugging → 临时载入附加组件（重启后失效）。"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.xpi --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.xpi \
              --title "v$VERSION" \
              --generate-notes \
              --notes "$NOTES"
          fi
